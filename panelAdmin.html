<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de ventas pasteleria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <header class="header">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="index.html">
                        <img src="img/logo.png" alt="Logo Pastelería Mil Sabores" class="img-fluid"
                            style="max-height: 90px" />
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-dashboard">
                                <a class="nav-link active" aria-current="page" href="">Dashboard</a>
                            </li>
                            <li>
                                <a class="nav-link active" aria-current="page" href="">
                                    Clientes
                                </a>
                            </li>
                            <li>
                                <a class="nav-link active" aria-current="page" href="">
                                    Ventas
                                </a>
                            </li>
                            <li>
                                <a class="nav-link active" aria-current="page" href="">
                                    Reportes
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>


        </header>

        <main class="main">
            <header class="header">
                <h1>Dashboard</h1>
                <button id="btn-nuevaVenta" class="btn">
                    Nueva venta
                </button>

                <section class="metrics" id="metrics"></section>

                <section class="table-section">
                    <h3>Ultimas ventas</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Clientes</th>
                                <th>Monto</th>
                                <th>Fechas</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVentas"></tbody>
                    </table>
                </section>
            </header>
        </main>
    </div>

    <div class="modal aria-hidden" id="modalVenta">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Nueva venta</h5>
            </div>
            <div class="modal-body">
                <form id="formVenta">
                    <label>Cliente</label>
                    <select id="selectCliente"></select>

                    <label>Monto</label>
                    <input type="number" id="inputMonto" required>

                    <div class="modal-footer">
                        <button type="button"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>



</body>

</html>
